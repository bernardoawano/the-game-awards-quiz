services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tga
      POSTGRES_PASSWORD: tga
      POSTGRES_DB: tga
    ports:
      - '5432:5432'
    volumes:
      - tga_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tga -d tga']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tga_postgres_data:
